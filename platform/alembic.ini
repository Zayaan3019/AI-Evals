# Alembic configuration.
#
# sqlalchemy.url is intentionally absent: the DSN comes from settings at runtime
# (see alembic/env.py). Pinning a URL here would make it trivially easy to run a
# migration against the wrong database by forgetting to override it.

[alembic]
script_location = alembic
prepend_sys_path = src
# Timestamped, ordered filenames so the migration history reads chronologically
# in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
